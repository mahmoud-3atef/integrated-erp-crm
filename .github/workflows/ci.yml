name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Throw-away SQL Server 2022 for the integration tests (the password only protects this container).
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci_Only_Pass_2026!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci_Only_Pass_2026!' -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      ERP_TEST_SQLSERVER: "Server=localhost,1433;User Id=sa;Password=Ci_Only_Pass_2026!;TrustServerCertificate=true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore IntegratedErp.slnx

      - name: Build
        run: dotnet build IntegratedErp.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test IntegratedErp.slnx --configuration Release --no-build --logger "trx;LogFilePrefix=results"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Web/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build (includes typecheck)
        run: npm run build
