name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore IntegratedErp.slnx

      - name: Build
        run: dotnet build IntegratedErp.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test IntegratedErp.slnx --configuration Release --no-build --logger "trx;LogFilePrefix=results"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
